name: Build One Piece Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=1" >> ~/.gradle/gradle.properties

      - name: Verify Release Keystore
        run: |
          keytool -list -v -keystore .github/keystore/release.jks -storepass onepiecekey2026

      - name: Build APK with Flet
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
        run: >-
          flet build apk
          --product "One Piece"
          --org "com.onepiece"
          --arch arm64-v8a
          --build-version "1.0.1"
          --build-number ${{ github.run_number }}
          --android-signing-key-store "${{ github.workspace }}/.github/keystore/release.jks"
          --android-signing-key-store-password "onepiecekey2026"
          --android-signing-key-password "onepiecekey2026"
          --android-signing-key-alias "onepiece"
          --yes -vv

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-android-apk
          path: build/apk/**/*.apk
          if-no-files-found: error
